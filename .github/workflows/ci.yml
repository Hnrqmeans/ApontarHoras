# Testes e lint automáticos a cada push/PR em dev e main.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

# só lê o código
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar (app sem dependências + ferramentas de teste)
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: python -m ruff check src tests scripts
      - name: Testes
        run: python -m pytest -q
