; Configuração do ApontarHoras. Depois de mudar, feche e abra o ApontarHoras.exe.

[servidor]
; sim = aceita acessos de outros computadores (servidor da empresa: rede e VPN)
; nao = só este computador (para testar)
rede = nao

; Porta do endereço http://<computador>:<porta>/
porta = 8080

; Pasta do banco de dados. Vazio = padrão (%LOCALAPPDATA%\ApontarHoras).
; No servidor, use uma pasta incluída no backup, ex.: D:\ApontarHoras\dados
dados =

; sim = abre o navegador ao iniciar (no servidor, use nao)
abrir_navegador = sim
