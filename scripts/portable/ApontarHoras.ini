; Configuração do ApontarHoras. Depois de mudar, feche e abra o ApontarHoras.exe.

[servidor]
; sim = aceita acessos de outros computadores (servidor da empresa: rede e VPN)
; nao = só este computador (para testar)
rede = nao

; Porta do endereço http://<computador>:<porta>/
porta = 8080

; Pasta do banco de dados. Vazio = padrão (%LOCALAPPDATA%\ApontarHoras).
; No servidor, use uma pasta incluída no backup, ex.: D:\ApontarHoras\dados
dados =

; sim = abre o navegador ao iniciar (no servidor, use nao)
abrir_navegador = sim

; Jornada esperada por dia, de segunda a domingo (H:MM; 0 = não trabalha). Base das pendências.
; Padrão (vazio): 8:00 de segunda a sexta. Ex.: jornada = 8:00, 8:00, 8:00, 8:00, 8:00, 0, 0
jornada =

; sim = o acesso é feito por HTTPS (proxy da TI com o certificado da empresa na frente do app).
; O cookie de sessão passa a ser "Secure" e nunca trafega sem criptografia. Sem HTTPS, deixe nao.
https = nao
